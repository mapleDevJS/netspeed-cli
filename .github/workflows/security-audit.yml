name: Security Audit

on:
  workflow_dispatch:
    inputs:
      audit_type:
        description: Type of audit to run
        required: true
        default: full
        type: choice
        options: [full, dependencies, code]
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - deny.toml
      - .github/workflows/security-audit.yml

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency and License Audit
    if: github.event_name == 'pull_request' || github.event.inputs.audit_type == 'full' || github.event.inputs.audit_type == 'dependencies'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: taiki-e/install-action@cd1c8251b429e645b6b4fef021814af1150c1f22 # cargo-audit
      - name: Check Rust security advisories
        run: cargo audit
      - uses: taiki-e/install-action@bad5eddc21a2ff90971c4477b7ff723d0d0b0db6 # cargo-deny
      - name: Check advisories, licenses, bans, and sources
        run: cargo deny check

  code-analysis:
    name: Rust Static Analysis
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.audit_type == 'full' || github.event.inputs.audit_type == 'code')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
      - name: Run clippy security checks
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

name: Release Readiness

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  readiness:
    name: Manual Release Readiness
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
      - name: Install cargo-deny
        uses: taiki-e/install-action@bad5eddc21a2ff90971c4477b7ff723d0d0b0db6 # cargo-deny
      - name: Validate workflow YAML
        run: |
          ruby <<'RUBY'
          require "yaml"
          Dir[".github/**/*.yml"].each do |file|
            YAML.load_file(file)
            puts "ok #{file}"
          end
          RUBY
      - name: Run complete release gates
        run: |
          bash scripts/release-checks.sh
          scripts/check-generated-docs.sh
      - name: Render the latest released formula
        run: |
          VERSION="$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1 | sed 's/^v//')"
          scripts/render-homebrew-formula.sh "${VERSION}" /tmp/netspeed-cli.rb
          grep -Fq "refs/tags/v${VERSION}.tar.gz" /tmp/netspeed-cli.rb
          grep -q '^[[:space:]]*sha256 "[0-9a-f]\{64\}"$' /tmp/netspeed-cli.rb

  channel-sync:
    name: Manual Release Channel Drift Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Check release channel sync
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-release-sync.sh

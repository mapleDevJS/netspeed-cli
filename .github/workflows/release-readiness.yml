name: Release Readiness

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  readiness:
    name: Manual Release Readiness
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
      - name: Install cargo-deny
        uses: taiki-e/install-action@bad5eddc21a2ff90971c4477b7ff723d0d0b0db6 # cargo-deny
      - name: Validate workflow YAML
        run: |
          ruby <<'RUBY'
          require "yaml"
          Dir[".github/**/*.yml"].each do |file|
            YAML.load_file(file)
            puts "ok #{file}"
          end
          RUBY
      - name: Run complete release gates
        run: |
          bash scripts/release-checks.sh
          scripts/check-generated-docs.sh
      - name: Render the latest released formula
        run: |
          VERSION="$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1 | sed 's/^v//')"
          scripts/render-homebrew-formula.sh "${VERSION}" /tmp/netspeed-cli.rb
          grep -q "version \"${VERSION}\"" /tmp/netspeed-cli.rb

  scheduled-sync:
    name: Weekly Release Channel Drift Check
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Check release channel sync
        id: sync
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-release-sync.sh
      - name: Open drift issue if none is already open
        if: steps.sync.outcome == 'failure' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          issue_number=$(gh issue list --state open --search 'in:title "Release channel drift detected"' \
            --json number,title \
            --jq 'first(.[] | select(.title == "Release channel drift detected") | .number) // empty')
          if [ -n "$issue_number" ]; then
            echo "::notice::Release drift is already tracked by issue #$issue_number."
          else
            gh issue create \
              --title "Release channel drift detected" \
              --body "The scheduled release sync check failed. Run \`scripts/check-release-sync.sh\` locally and update the out-of-sync channel."
          fi

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Prepare a version PR, or tag its merged main commit (X.Y.Z)"
        required: true
        type: string
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  HOMEBREW_TAP_REPO: mapleDevJS/homebrew-netspeed-cli

permissions:
  contents: read

# Serialize manual preparation separately from each tag publishing run.
# A new dispatch must not replace a queued tag release.
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && 'preparation' || github.ref }}
  cancel-in-progress: false

jobs:
  release-context:
    name: Prepare Release Context
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.context.outputs.version }}
      tag: ${{ steps.context.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

        with:
          components: clippy, rustfmt

      - name: Install git-cliff
        if: github.event_name == 'workflow_dispatch'
        run: cargo install git-cliff --locked

      - name: Install cargo-deny
        if: github.event_name == 'workflow_dispatch'
        uses: taiki-e/install-action@bad5eddc21a2ff90971c4477b7ff723d0d0b0db6 # cargo-deny

      - name: Validate existing tag release
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/validate-release.py "$RELEASE_TAG"

      - name: Prepare PR or tag approved main
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::error::RELEASE_TOKEN requires contents and pull request write access."
            exit 1
          fi
          gh auth setup-git
          python3 scripts/prepare-release.py "$VERSION"

      - name: Set release context
        id: context
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${INPUT_VERSION}"
            TAG="v${VERSION}"
          else
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  validate-release:
    name: Validate Release Before Publishing
    runs-on: ubuntu-latest
    needs: [release-context]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ needs.release-context.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - uses: taiki-e/install-action@bad5eddc21a2ff90971c4477b7ff723d0d0b0db6 # cargo-deny
      - name: Check tag and package identity
        env:
          RELEASE_TAG: ${{ needs.release-context.outputs.tag }}
        run: python3 scripts/validate-release.py "$RELEASE_TAG"
      - name: Run release gates
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-features
          cargo test --locked --lib socket_regression -- --ignored
          cargo test --locked --test mock_network_test --test integration_upload_fetch_test --test e2e_test -- --ignored
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps
          python3 -m unittest discover -s scripts -p 'test_*.py'
          cargo deny check
          cargo package --locked
          cargo publish --dry-run --locked

  build-binaries:
    name: Build Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: [release-context, validate-release]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: netspeed-cli
            asset_name: netspeed-cli-x86_64-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: netspeed-cli
            asset_name: netspeed-cli-aarch64-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: netspeed-cli
            asset_name: netspeed-cli-x86_64-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact_name: netspeed-cli
            asset_name: netspeed-cli-aarch64-linux-musl
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: netspeed-cli
            asset_name: netspeed-cli-x86_64-macos
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: netspeed-cli
            asset_name: netspeed-cli-aarch64-macos
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: netspeed-cli.exe
            asset_name: netspeed-cli-x86_64-windows.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ needs.release-context.outputs.tag }}

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - name: Install cross-compilation tools (aarch64 Linux GNU)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Configure aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml << 'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Install musl tools (x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install cross (aarch64 musl)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cargo install cross --locked

      - name: Build release (cross)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cross build --release --target ${{ matrix.target }}

      - name: Build release (native)
        if: matrix.target != 'aarch64-unknown-linux-musl'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" "dist/${{ matrix.asset_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  publish-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [release-context, build-binaries]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ needs.release-context.outputs.tag }}
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd release-assets
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          artifact-name: sbom.spdx.json
          output-file: release-assets/sbom.spdx.json
          format: spdx-json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ needs.release-context.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::error::RELEASE_TOKEN is required to create GitHub Releases."
            exit 1
          fi
          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes-file CHANGELOG.md \
            --repo "${{ github.repository }}"
          gh release upload "${TAG}" release-assets/* --repo "${{ github.repository }}" --clobber

  update-local-homebrew-formula:
    name: Open Local Homebrew Formula PR
    runs-on: ubuntu-latest
    needs: [release-context, publish-github-release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Open formula update PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          set -euo pipefail
          gh auth setup-git
          python3 scripts/prepare-release.py "$VERSION" --formula

  publish-crates-io:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [release-context, publish-github-release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ needs.release-context.outputs.tag }}

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - name: Verify package
        run: |
          cargo test --verbose
          cargo test --doc
          cargo package --locked

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

  brew-audit:
    name: Audit Released Homebrew Formula
    runs-on: macos-latest
    needs: [release-context, publish-github-release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ needs.release-context.outputs.tag }}
      - name: Render and audit released formula
        env:
          VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          set -euo pipefail
          tap_dir="$(brew --repository)/Library/Taps/mapledevjs/homebrew-netspeed-cli"
          mkdir -p "$tap_dir"
          scripts/render-homebrew-formula.sh "$VERSION" "$tap_dir/netspeed-cli.rb"
          git -C "$tap_dir" init
          git -C "$tap_dir" config user.name "github-actions[bot]"
          git -C "$tap_dir" config user.email "github-actions[bot]@users.noreply.github.com"
          git -C "$tap_dir" add netspeed-cli.rb
          git -C "$tap_dir" commit -m "Audit released formula"
          brew install --build-from-source mapledevjs/netspeed-cli/netspeed-cli
          brew audit --strict --online mapledevjs/netspeed-cli/netspeed-cli

  homebrew-tap-pr:
    name: Open Homebrew Tap PR
    runs-on: ubuntu-latest
    needs: [release-context, publish-crates-io, brew-audit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ needs.release-context.outputs.tag }}

      - name: Create or update tap PR
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPO: ${{ env.HOMEBREW_TAP_REPO }}
          VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::error::HOMEBREW_TAP_TOKEN is required to open the tap PR."
            exit 1
          fi

          git clone "https://x-access-token:${GH_TOKEN}@github.com/${TAP_REPO}.git" homebrew-tap
          scripts/render-homebrew-formula.sh "${VERSION}" homebrew-tap/netspeed-cli.rb

          cd homebrew-tap
          BRANCH="release/netspeed-cli-v${VERSION}"
          git checkout -B "${BRANCH}"

          if git diff --quiet -- netspeed-cli.rb; then
            echo "Homebrew tap formula is already at v${VERSION}."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add netspeed-cli.rb
          git commit -m "netspeed-cli v${VERSION}"
          git push --force-with-lease origin "${BRANCH}"

          if gh pr view "${BRANCH}" --repo "${TAP_REPO}" >/dev/null 2>&1; then
            echo "Homebrew tap PR already exists for ${BRANCH}."
          else
            gh pr create \
              --repo "${TAP_REPO}" \
              --base main \
              --head "${BRANCH}" \
              --title "netspeed-cli v${VERSION}" \
              --body "Update netspeed-cli formula to v${VERSION}."
          fi

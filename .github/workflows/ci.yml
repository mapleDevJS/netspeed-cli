name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Cache dependencies
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
      - name: Run tests
        run: cargo test --locked --verbose
      - name: Run socket integration tests
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo test --locked --lib socket_regression -- --ignored
          cargo test --locked --test mock_network_test --test integration_upload_fetch_test --test e2e_test -- --ignored --nocapture
      - name: Build release
        run: cargo build --locked --release

  quality:
    name: Ubuntu Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
      - name: Check formatting and lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Check documentation and package
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --locked --no-deps --workspace
          cargo package --locked
      - name: Check crates.io publication package
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.base.ref == 'main'
        run: cargo publish --dry-run --locked
      - name: Check generated docs and release scripts
        run: |
          scripts/check-generated-docs.sh
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Check dependencies and licenses
        uses: taiki-e/install-action@bad5eddc21a2ff90971c4477b7ff723d0d0b0db6 # cargo-deny
      - name: Run cargo-deny
        run: cargo deny check
      - name: Check minimum supported Rust version
        run: |
          rustup toolchain install 1.86 --profile minimal
          cargo +1.86 check --locked

  benchmarks:
    name: Benchmark Regression Check
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
      - name: Select latest successful main baseline commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          baseline_sha=$(gh run list --workflow ci.yml --branch main --event workflow_dispatch --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
          echo "BASELINE_SHA=$baseline_sha" >> "$GITHUB_ENV"
          if [ -z "$baseline_sha" ]; then
            echo "::notice::No successful manually dispatched main baseline; this run will bootstrap one."
          fi
      - name: Measure baseline on the current runner
        if: env.BASELINE_SHA != ''
        run: |
          set -euo pipefail
          baseline_dir="$RUNNER_TEMP/netspeed-benchmark-baseline"
          git worktree add --detach "$baseline_dir" "$BASELINE_SHA"
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/benchmark-reference" cargo +stable bench --locked --manifest-path "$baseline_dir/Cargo.toml" --bench core_benchmarks -- --noplot
      - name: Run benchmarks
        run: cargo +stable bench --locked --bench core_benchmarks -- --noplot
      - name: Check for regressions
        if: env.BASELINE_SHA != ''
        # Preserve the upstream guard against noisy nanosecond-scale URL benchmarks.
        run: python3 scripts/check-benchmarks.py target/benchmark-reference/criterion target/criterion --ignore-prefix url_ --minimum-absolute-delta-ns 25
  coverage:
    name: Code Coverage
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Collect coverage
        run: |
          cargo llvm-cov --all-features --no-report
          cargo llvm-cov --all-features --no-report --lib -- socket_regression --ignored
          cargo llvm-cov --all-features --no-report --test mock_network_test --test integration_upload_fetch_test --test e2e_test -- --ignored
      - name: Enforce coverage threshold
        run: cargo llvm-cov report --lcov --output-path lcov.info --fail-under-lines=83
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v6
        with:
          files: lcov.info
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Trust local checkout
        if: env.ACT == 'true'
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Cache dependencies
        uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        if: ${{ !env.ACT }}
      - name: Run tests
        run: bash scripts/ci-checks.sh test
      - name: Run socket integration tests
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/ci-checks.sh socket
      - name: Build release
        run: bash scripts/ci-checks.sh build

  quality:
    name: Ubuntu Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Trust local checkout
        if: env.ACT == 'true'
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        if: ${{ !env.ACT }}
      - name: Install quality tools
        uses: taiki-e/install-action@bad5eddc21a2ff90971c4477b7ff723d0d0b0db6
        with:
          tool: cargo-deny,shellcheck
      - name: Install workflow linter
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch=amd64 ;;
            aarch64) arch=arm64 ;;
            *) echo 'Unsupported Linux architecture' >&2; exit 1 ;;
          esac
          install_dir="$(mktemp -d)"
          asset="actionlint_1.7.12_linux_${arch}.tar.gz"
          release_url=https://github.com/rhysd/actionlint/releases/download/v1.7.12
          curl -fsSL --retry 3 "$release_url/$asset" -o "$install_dir/$asset"
          curl -fsSL --retry 3 "$release_url/actionlint_1.7.12_checksums.txt" -o "$install_dir/checksums.txt"
          (cd "$install_dir" && sha256sum --ignore-missing -c checksums.txt)
          tar -xzf "$install_dir/$asset" -C "$install_dir" actionlint
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Validate workflows
        run: bash scripts/ci-checks.sh workflows
      - name: Run shared quality checks
        run: bash scripts/ci-checks.sh quality
      - name: Check crates.io publication package
        run: bash scripts/ci-checks.sh publish
      - name: Check minimum supported Rust version
        run: |
          rustup toolchain install 1.86 --profile minimal
          bash scripts/ci-checks.sh msrv

  benchmarks:
    name: Benchmark Regression Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        if: ${{ !env.ACT }}
      - name: Select latest successful main baseline commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          baseline_sha=$(gh run list --workflow ci.yml --branch main --event workflow_dispatch --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
          echo "BASELINE_SHA=$baseline_sha" >> "$GITHUB_ENV"
          if [ -z "$baseline_sha" ]; then
            echo "::notice::No successful manually dispatched main baseline; this run will bootstrap one."
          fi
      - name: Measure baseline on the current runner
        if: env.BASELINE_SHA != ''
        run: |
          set -euo pipefail
          baseline_dir="$RUNNER_TEMP/netspeed-benchmark-baseline"
          git worktree add --detach "$baseline_dir" "$BASELINE_SHA"
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/benchmark-reference" cargo +stable bench --locked --manifest-path "$baseline_dir/Cargo.toml" --bench core_benchmarks -- --noplot
      - name: Run benchmarks
        run: cargo +stable bench --locked --bench core_benchmarks -- --noplot
      - name: Check for regressions
        if: env.BASELINE_SHA != ''
        # Preserve the upstream guard against noisy nanosecond-scale URL benchmarks.
        run: python3 scripts/check-benchmarks.py target/benchmark-reference/criterion target/criterion --ignore-prefix url_ --minimum-absolute-delta-ns 25
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        if: ${{ !env.ACT }}
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Collect and enforce coverage
        run: bash scripts/ci-checks.sh coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v6
        with:
          files: lcov.info
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

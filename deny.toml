# cargo-deny configuration for dependency security auditing.
# Run: cargo deny check
# Docs: https://github.com/EmbarkStudios/cargo-deny

[graph]
targets = []
all-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
# Known RUSTSEC advisories - add entries here when a temporary exception is required.
# Format: { id = "RUSTSEC-XXXX-XXXX", reason = "description" }
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = []
skip = [
    # Transitive: ring/rustls still pins getrandom 0.2 while current test/build
    # tooling uses newer getrandom majors. Keep until ring upgrades.
    { name = "getrandom", version = "0.2.17" },
    # Transitive: ring uses windows-sys 0.52 on Windows while terminal/tooling
    # crates use windows-sys 0.61. Keep until ring upgrades.
    { name = "windows-sys", version = "0.52.0" },
]
skip-tree = [
    # Transitive: toml pulls in both winnow 0.7 and 1.0 via toml_parser
    { name = "winnow", version = "1.0.1" },
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
